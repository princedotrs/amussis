[package]
name = "vault"
version = "0.1.0"
edition = "2021"
description = "Time-locked SOL vault"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.2.2"

[dev-dependencies]
litesvm = "0.18.2"
solana-address = "2.7"
solana-clock = "3"
solana-instruction = "3.5"
solana-keypair = "3"
solana-message = "4.6"
solana-signer = "3"
solana-transaction = "4.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug", "no-log-ix-name"))'] }
